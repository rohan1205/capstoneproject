services:
  # ── MongoDB ──
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - breachlens-net

  # ── ML Microservice (FastAPI) ──
  ml:
    build:
      context: ./ml
    restart: unless-stopped
    ports:
      - "8003:8000"   # 🔥 UPDATED (was 8001)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - breachlens-net

  # ── Node.js App ──
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/breachlens
      SESSION_SECRET: ${SESSION_SECRET:-super-secret-key}
      NODE_ENV: production
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost/auth/google/callback}
      ML_API_URL: http://ml:8000
      ML_TIMEOUT_MS: 10000
    networks:
      - breachlens-net
    depends_on:
      mongo:
        condition: service_started
      ml:
        condition: service_healthy

  # ── Nginx (Reverse dd Proxy) ──
  nginx:
    build: ./nginx
    restart: unless-stopped
    ports:
      - "8082:80"   # 🔥 UPDATED (was 80)
    depends_on:
      - app
    networks:
      - breachlens-net

networks:
  breachlens-net:
    driver: bridge

volumes:
  mongo-data: